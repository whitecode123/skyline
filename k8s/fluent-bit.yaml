apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  namespace: amazon-cloudwatch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluent-bit-role
rules:
  - nonResourceURLs:
      - /metrics
    verbs:
      - get
  - apiGroups: [""]
    resources:
      - namespaces
      - pods
      - pods/logs
      - nodes
      - nodes/proxy
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluent-bit-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluent-bit-role
subjects:
  - kind: ServiceAccount
    name: fluent-bit
    namespace: amazon-cloudwatch
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-cluster-info
  namespace: amazon-cloudwatch
data:
  cluster.name: rjs-cluster
  logs.region: ap-northeast-2
  http.server: "On"
  http.port: "2020"
  read.head: "On"
  read.tail: "Off"
---
apiVersion: v1
kind: ConfigMap
apiVersion: v1
metadata:
  name: fluent-bit-config
  namespace: amazon-cloudwatch
  labels:
    k8s-app: fluent-bit
data:
  # =================================================================================================
  # 1. 메인 설정 파일: 각 설정 파일을 불러오는(@INCLUDE) 역할을 합니다.
  # =================================================================================================
  fluent-bit.conf: |
    [SERVICE]
        Flush                     5
        Grace                     30
        Log_Level                 info
        Daemon                    off
        Parsers_File              parsers.conf
        HTTP_Server               On
        HTTP_Listen               0.0.0.0
        HTTP_Port                 2020
        storage.path              /var/fluent-bit/state/flb-storage/
        storage.sync              normal
        storage.checksum          off
        storage.backlog.mem_limit 5M

    @INCLUDE application-logs.conf
    @INCLUDE dataplane-logs.conf
    @INCLUDE host-logs.conf
    @INCLUDE outputs.conf

  # =================================================================================================
  # 2. 애플리케이션 로그 수집 정의
  # =================================================================================================
  application-logs.conf: |
    [INPUT]
        Name                tail
        Tag                 application.*
        Path                /var/log/containers/*.log
        Exclude_Path        /var/log/containers/aws-node*,/var/log/containers/kube-proxy*,/var/log/containers/fluent-bit*,/var/log/containers/cloudwatch-agent*
        multiline.parser    docker, cri
        DB                  /var/fluent-bit/state/flb_container.db
        Mem_Buf_Limit       50MB
        Skip_Long_Lines     On
        Refresh_Interval    10
        Read_from_Head      false
        Rotate_Wait         30
        storage.type        filesystem
    
    [FILTER]
        Name                kubernetes
        Match               application.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_Tag_Prefix     application.var.log.containers.
        Merge_Log           On
        Merge_Log_Key       log_processed
        K8S-Logging.Parser  On
        K8S-Logging.Exclude Off
        Buffer_Size         0
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Use_Journal         Off
        Cache_Use_Docker_Id On
        
    [FILTER]
        Name                record_modifier
        Match               application.*
        Record              cluster_name rjs-cluster
        Record              log_type application

  # =================================================================================================
  # 3. 데이터플레인 로그 수집 정의 (kubelet, containerd, aws-node 등)
  # =================================================================================================
  dataplane-logs.conf: |
    [INPUT]
        Name                systemd
        Tag                 dataplane.systemd.*
        Systemd_Filter      _SYSTEMD_UNIT=(kubelet|containerd)\.service
        Read_From_Tail      On
        Strip_Underscores   On
        Max_Entries         1000
        DB                  /var/fluent-bit/state/systemd.db
    
    [INPUT]
        Name                tail
        Tag                 dataplane.containers.cni
        Path                /var/log/containers/aws-node*.log
        multiline.parser    docker, cri
        DB                  /var/fluent-bit/state/cni.db
        Read_from_Head      false
        Mem_Buf_Limit       5MB
        Skip_Long_Lines     On
        Rotate_Wait         30

    [INPUT]
        Name                tail
        Tag                 dataplane.containers.kube-proxy
        Path                /var/log/containers/kube-proxy*.log
        multiline.parser    docker, cri
        DB                  /var/fluent-bit/state/kube-proxy.db
        Read_from_Head      false
        Mem_Buf_Limit       5MB
        Skip_Long_Lines     On
        Rotate_Wait         30
    
    [FILTER]
        Name                aws
        Match               dataplane.*
        az                  true
        vpc_id              true
        account_id          true
        ec2_instance_id     true
        ec2_instance_type   true
        private_ip          true

    [FILTER]
        Name                record_modifier
        Match               dataplane.*
        Record              cluster_name rjs-cluster
        Record              log_type dataplane

  # =================================================================================================
  # 4. 호스트(OS) 로그 수집 정의
  # =================================================================================================
  host-logs.conf: |
    [INPUT]
        Name                tail
        Tag                 host.messages
        Path                /var/log/messages
        Parser              syslog
        DB                  /var/fluent-bit/state/flb_messages.db
        Read_from_Head      false
        Skip_Long_Lines     On
        Rotate_Wait         30

    [INPUT]
        Name                tail
        Tag                 host.secure
        Path                /var/log/secure
        Parser              syslog
        DB                  /var/fluent-bit/state/flb_secure.db
        Read_from_Head      false
        Skip_Long_Lines     On
        Rotate_Wait         30
    
    [FILTER]
        Name                aws
        Match               host.*
        az                  true
        vpc_id              true
        account_id          true
        ec2_instance_id     true
        ec2_instance_type   true
        private_ip          true

    [FILTER]
        Name                record_modifier
        Match               host.*
        Record              cluster_name rjs-cluster
        Record              log_type host

  # =================================================================================================
  # 5. 모든 최종 목적지(OUTPUT) 정의: CloudWatch 3곳 + OpenSearch 1곳
  # =================================================================================================
  outputs.conf: |
    [OUTPUT]
        Name                cloudwatch_logs
        Match               application.*
        region              ap-northeast-2
        log_group_name      /aws/containerinsights/rjs-cluster/application
        log_stream_prefix   app-
        auto_create_group   true
        log_retention_days  7
        workers             1
    
    [OUTPUT]
        Name                cloudwatch_logs
        Match               dataplane.*
        region              ap-northeast-2
        log_group_name      /aws/containerinsights/rjs-cluster/dataplane
        log_stream_prefix   dp-
        auto_create_group   true
        log_retention_days  7
        workers             1

    [OUTPUT]
        Name                cloudwatch_logs
        Match               host.*
        region              ap-northeast-2
        log_group_name      /aws/containerinsights/rjs-cluster/host
        log_stream_prefix   host-
        auto_create_group   true
        log_retention_days  7
        workers             1
        
        # [OUTPUT]
        #Name                opensearch
        #Match               *
        #Host                search-eks-log-dashboard-ofx6asurhtwfzf34n3q6ebyshm.ap-northeast-2.es.amazonaws.com
        #Port                443
        #AWS_Auth            On
        #AWS_Region          ap-northeast-2
        #Index               eks-logs-%Y.%m.%d
        #Type                _doc
        #tls                 On
        #tls.verify          On
        #Retry_Limit         3
        #workers             1
        #Suppress_Type_Name  On
        #Include_Tag_Key     On
        #Tag_Key             fluent_tag
        #Buffer_Size         5MB 
        
        
  # =================================================================================================
  # 6. 파서 정의
  # =================================================================================================
  parsers.conf: |
    [PARSER]
        Name                syslog
        Format              regex
        Regex               ^(?<time>[^ ]* {1,2}[^ ]* [^ ]*) (?<host>[^ ]*) (?<ident>[a-zA-Z0-9_\/\.\-]*)(?:\[(?<pid>[0-9]+)\])?(?:[^\:]*\:)? *(?<message>.*)$
        Time_Key            time
        Time_Format         %b %d %H:%M:%S

    [PARSER]
        Name                docker
        Format              json
        Time_Key            time
        Time_Format         %Y-%m-%dT%H:%M:%S.%L%z
        Time_Keep           On
        Decode_Field_As     escaped_utf8 log

    [PARSER]
        Name                cri
        Format              regex
        Regex               ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<flag>[^ ]+) (?<log>.*)$
        Time_Key            time
        Time_Format         %Y-%m-%dT%H:%M:%S.%L%z
        Time_Keep           On

    [PARSER]
        Name                containerd
        Format              regex
        Regex               ^(?<time>[^ ]+) (?<level>[^ ]+) (?<message>.*)$
        Time_Key            time
        Time_Format         %Y-%m-%dT%H:%M:%S.%L%z
        Time_Keep           On
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: amazon-cloudwatch
  labels:
    k8s-app: fluent-bit
    version: v1
    kubernetes.io/cluster-service: "true"
spec:
  selector:
    matchLabels:
      k8s-app: fluent-bit
  template:
    metadata:
      labels:
        k8s-app: fluent-bit
        version: v1
        kubernetes.io/cluster-service: "true"
    spec:
      containers:
      - name: fluent-bit
        image: public.ecr.aws/aws-observability/aws-for-fluent-bit:2.32.4
        imagePullPolicy: Always
        env:
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: fluent-bit-cluster-info
                  key: logs.region
            - name: CLUSTER_NAME
              valueFrom:
                configMapKeyRef:
                  name: fluent-bit-cluster-info
                  key: cluster.name
            - name: HTTP_SERVER
              valueFrom:
                configMapKeyRef:
                  name: fluent-bit-cluster-info
                  key: http.server
            - name: HTTP_PORT
              valueFrom:
                configMapKeyRef:
                  name: fluent-bit-cluster-info
                  key: http.port
            - name: READ_FROM_HEAD
              valueFrom:
                configMapKeyRef:
                  name: fluent-bit-cluster-info
                  key: read.head
            - name: READ_FROM_TAIL
              valueFrom:
                configMapKeyRef:
                  name: fluent-bit-cluster-info
                  key: read.tail
            - name: HOST_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.name
            - name: CI_VERSION
              value: "k8s/1.3.37"
        resources:
            limits:
              memory: 200Mi
            requests:
              cpu: 500m
              memory: 100Mi
        volumeMounts:
        # Please don't change below read-only permissions
        - name: fluentbitstate
          mountPath: /var/fluent-bit/state
        - name: varlog
          mountPath: /var/log
          readOnly: true
        - name: varlibdockercontainers
          mountPath: /var/lib/docker/containers
          readOnly: true
        - name: fluent-bit-config
          mountPath: /fluent-bit/etc/
        - name: runlogjournal
          mountPath: /run/log/journal
          readOnly: true
        - name: dmesg
          mountPath: /var/log/dmesg
          readOnly: true
      terminationGracePeriodSeconds: 10
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      volumes:
      - name: fluentbitstate
        hostPath:
          path: /var/fluent-bit/state
      - name: varlog
        hostPath:
          path: /var/log
      - name: varlibdockercontainers
        hostPath:
          path: /var/lib/docker/containers
      - name: fluent-bit-config
        configMap:
          name: fluent-bit-config
      - name: runlogjournal
        hostPath:
          path: /run/log/journal
      - name: dmesg
        hostPath:
          path: /var/log/dmesg
      serviceAccountName: fluent-bit
      nodeSelector:
        kubernetes.io/os: linux
